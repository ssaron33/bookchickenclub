<!doctype html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="theme-color" content="#f7f4ee" />
  <meta name="description" content="북치킨클럽 독서 아카이브" />

  <title>북치킨클럽</title>

<body>
  <header class="topbar">
    <div class="topbar-inner">
      <a class="brand" href="#home" aria-label="북치킨클럽 홈">
        <span class="brand-mark">북</span>
        <span><strong>북치킨클럽</strong><small>Book Chicken Club</small></span>
      </a>
      <nav class="desktop-nav nav-fill" aria-label="주요 메뉴">
        <a href="#home">홈</a>
        <a href="#books">책</a>
        <a href="#members">회원</a>
        <a href="#records">독서 기록</a>
        <a id="writeRecordNav" href="#write-record">기록 작성</a>

    </div>
    <div id="app"></div>

  <footer class="footer">
    <div><strong>북치킨클럽</strong><span> · 독서 기록 아카이브</span></div>
    <span>Google Sheets 공유 DB · v0.7.1</span>
  </footer>

  <script src="app.js"></script>
